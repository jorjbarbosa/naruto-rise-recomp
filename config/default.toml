# XenonRecomp configuration for Naruto: Rise of a Ninja, default.xex (retail, XDK 6274).
# Paths are relative to this file. Run scripts/recompile.ps1 instead of calling XenonRecomp directly:
# it applies patches/, builds the tools and recreates the output directory.

[main]
file_path = "../game/default.xex"
out_directory_path = "../build/ppc"
switch_table_file_path = "default_switch_tables.toml"

# Register save/restore helpers. Found by byte pattern and confirmed against the XDK 6274 libraries.
restgprlr_14_address = 0x822C5480
savegprlr_14_address = 0x822C5430
restfpr_14_address = 0x822C80DC
savefpr_14_address = 0x822C8090
restvmx_14_address = 0x8253BF18
savevmx_14_address = 0x8253BC80
restvmx_64_address = 0x8253BFAC
savevmx_64_address = 0x8253BD14

# CRT setjmp/longjmp, redirected to the host. Used by XDK libraries (17 setjmp and 19 longjmp calls).
# The guest jmp_buf (84 x 16 bytes) is larger than the host one, so it can hold it.
longjmp_address = 0x822CC220
setjmp_address = 0x822CC540

# Data inside the code section. The function sweep skips these words between functions; without them
# each one turns into a bogus function.
invalid_instructions = [
    { data = 0x00000000, size = 4 },     # zero padding between functions (about 11,500 words)
    { data = 0x822C6B90, size = 8 },     # exception data before 237 functions: C++ frame handler + its data
    { data = 0x826BE634, size = 8 },     # exception data before 60 functions: __C_specific_handler (SEH) + scope table
    { data = 0x822D8530, size = 8 },     # exception data before 0x822D850C: _SkipUnwoundFrames
    { data = 0x00485645, size = 0x2D8 }, # XEX export table at the end of .text (172 ordinals)
]
